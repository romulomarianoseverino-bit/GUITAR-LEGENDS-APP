name: Integração Android, Firestore e Cloud Functions

on:
  push:
    branches:
      - fix/zero-start-rewards-security
  pull_request:
    branches:
      - main
      - fix/zero-start-rewards-security

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar chave de assinatura de depuração temporária
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Firebase CLI e dependências de teste
        run: |
          npm install --global firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase

      - name: Instalar dependências das Cloud Functions
        working-directory: functions
        run: npm install

      - name: Executar testes com Auth, Firestore e Functions Emulator
        env:
          CI: true
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore,functions "npm test --prefix functions && node --test firestore.test.js && gradle --no-daemon testDebugUnitTest assembleDebug"
