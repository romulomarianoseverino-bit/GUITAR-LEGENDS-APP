name: Diagnostico de actions externas
on:
  push:
    branches:
      - repair/restore-current-working-gameplay
  workflow_dispatch:

jobs:
  external-action-smoke-test:
    name: Verificar uso de actions externas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de teste
        uses: actions/checkout@v4
      - name: Confirmar execucao
        run: |
          echo "Actions externas foram aceitas."
          echo "Commit: ${{ github.sha }}"
