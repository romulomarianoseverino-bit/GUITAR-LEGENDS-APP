name: Validar APK de depuração da integração

on:
  push:
    branches:
      - integration/next-apk-validation
      - prep/next-apk-readiness-2026-11-24
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "settings.gradle.kts"
      - ".github/workflows/android-debug-apk-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar, testar e publicar APK de validação
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - name: Compilar APK de depuração
        id: build
        run: gradle --no-daemon assembleDebug

      - name: Executar testes unitários
        id: tests
        if: always() && steps.build.outcome == "success"
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \\
            'gradle --no-daemon testDebugUnitTest'

      - name: Publicar APK de validação
        if: always() && steps.build.outcome == "success" && steps.tests.outcome == "success"
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-validacao
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
