name: Validar recompensas diárias

on:
  pull_request:
    branches:
      - main
      - fix/auth-profile-spark-mainline
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/validar-recompensas-diarias.yml'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  android-validation:
    name: Compilar e executar testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Criar chave de assinatura de depuração temporária
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar variante de depuração
        run: gradle --no-daemon assembleDebug

      - name: Instalar Firebase CLI para emuladores locais
        run: npm install --global firebase-tools

      - name: Configurar Java 21 para os emuladores Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Executar testes unitários com Auth e Firestore Emulator
        run: firebase emulators:exec --project demo-no-project --only auth,firestore "gradle --no-daemon testDebugUnitTest"
