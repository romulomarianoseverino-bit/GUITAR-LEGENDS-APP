name: Validar recompensas diárias

on:
  pull_request:
    branches:
      - main
      - fix/auth-profile-spark-mainline
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/validar-recompensas-diarias.yml'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  android-validation:
    name: Compilar e executar testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar variante de depuração
        run: gradle --no-daemon assembleDebug

      - name: Executar testes unitários
        run: gradle --no-daemon testDebugUnitTest
