name: Validar recompensas diárias

on:
  # Segredos de assinatura não são disponibilizados em eventos pull_request
  # em contextos protegidos. Executar em push da branch confiável ou manualmente.
  push:
    branches:
      - fix/daily-reward-weekly-cap
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/validar-recompensas-diarias.yml'
      - 'firestore.rules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    name: Compilar e executar testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar chave permanente já cadastrada no repositório
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::O segredo DEBUG_KEYSTORE_BASE64 não está disponível."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::O segredo KEYSTORE_PASSWORD existente não está disponível."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::O segredo KEY_PASSWORD existente não está disponível."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar variante de depuração com a chave permanente
        id: debug_build
        run: gradle --no-daemon assembleDebug

      - name: Instalar Firebase CLI para emuladores locais
        run: npm install --global firebase-tools

      - name: Configurar Java 21 para os emuladores Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Executar testes unitários com Auth e Firestore Emulator
        run: firebase emulators:exec --project demo-no-project --only auth,firestore "gradle --no-daemon testDebugUnitTest"

      - name: Disponibilizar APK de depuração como artefato
        if: always() && steps.debug_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
