name: APK de teste com Firebase e login Google

on:
  push:
    branches:
      - fix/full-launch-scope-on-rewards-branch

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar APK de teste configurado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Firebase e validar OAuth Google
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::O segredo GOOGLE_SERVICES_JSON_BASE64 não está configurado no GitHub. O APK não será gerado sem Firebase/OAuth."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          data = json.loads(path.read_text())
          expected_package = "com.aistudio.applet.kpfcic"
          clients = data.get("client", [])
          matching = [
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package
          ]
          if not matching:
              raise SystemExit("google-services.json não contém o pacote Android esperado: " + expected_package)
          has_web_oauth = any(
              oauth.get("client_type") == 3
              for client in matching
              for oauth in client.get("oauth_client", [])
          )
          if not has_web_oauth:
              raise SystemExit("O cliente OAuth Web (client_type 3) não foi encontrado. Configure o cliente Web no Firebase/Google Cloud.")
          print("Configuração Firebase encontrada; pacote Android e cliente OAuth Web conferidos.")
          PY

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar chave de assinatura de depuração
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-Teste-Firebase-Google
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
