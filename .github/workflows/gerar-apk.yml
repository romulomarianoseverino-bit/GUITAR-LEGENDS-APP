name: Gerar APK do Guitar Legends

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Extrair fontes centrais do ZIP 1.1 para auditoria
        run: |
          python3 - <<'PY'
          import zipfile, glob, re
          path = glob.glob('**/guitar-legends-Atualizado1.1.zip', recursive=True)[0]
          with zipfile.ZipFile(path) as z:
              targets = [
                'app/src/main/java/com/example/guitarlegends/data/MusicLibraryRepository.kt',
                'app/src/main/java/com/example/guitarlegends/ui/screens/MusicLibraryScreen.kt',
                'app/src/main/java/com/example/guitarlegends/audio/AudioPlayerEngine.kt',
                'app/src/main/java/com/example/guitarlegends/analysis/AudioAnalyzer.kt',
                'app/src/main/java/com/example/guitarlegends/analysis/AdaptiveEngine.kt',
                'app/src/main/java/com/example/guitarlegends/viewmodel/GameViewModel.kt',
                'app/src/test/java/com/example/ExampleRobolectricTest.kt'
              ]
              for name in targets:
                try:
                  data = z.read(name).decode('utf-8')
                except KeyError:
                  print('ARQUIVO_AUSENTE:', name)
                  continue
                print('FONTE_ZIP:', name)
                if name.endswith('GameViewModel.kt'):
                  lines = data.splitlines()
                  patterns = re.compile(r'init\\s*\\{|importAudioFile|previewTrack|stopPreview|removeImported|deleteTrack|loadAllTracks|startMatch|selectTrack|onCleared')
                  selected = set()
                  for i, line in enumerate(lines):
                    if patterns.search(line):
                      selected.update(range(max(0,i-8), min(len(lines),i+42)))
                  data = '\\n'.join(f'{i+1}: {lines[i]}' for i in sorted(selected))
                elif name.endswith('ExampleRobolectricTest.kt'):
                  print('TOTAL_TESTES_ANNOTATION:', data.count('@Test'))
                  print('NOMES_TESTES:')
                  for line in data.splitlines():
                    if '@Test' in line or line.strip().startswith('fun '):
                      print(line)
                  continue
                print(data[:24000])
          PY
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar chave temporária de depuração
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
