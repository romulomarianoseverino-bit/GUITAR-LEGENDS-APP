name: Inspecionar APK de referência

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "ID do rascunho que contém o APK de referência"
        required: true
        default: "456255879"
        type: string
      asset_id:
        description: "ID do arquivo APK enviado"
        required: true
        default: "785479740"
        type: string
      expected_sha256:
        description: "SHA-256 confirmado pelo GitHub"
        required: true
        default: "ce822be320391f6639e83b907ffe02cab58848ee2e9dcb228f0903baa70baf77"
        type: string
      source_ref:
        description: "Branch/commit do código para comparação estática"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspecionar APK sem alterar o projeto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código para comparação estática
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Baixar APK do rascunho do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ inputs.asset_id }}
        run: |
          set -euo pipefail
          mkdir -p inspection
          curl --fail --location --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output inspection/reference.apk
          test -s inspection/reference.apk
          file inspection/reference.apk | tee inspection/file-type.txt

      - name: Validar integridade e estrutura do APK
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(sha256sum inspection/reference.apk | awk '{print $1}')"
          echo "SHA-256 esperado: ${EXPECTED_SHA256}" | tee inspection/integrity.txt
          echo "SHA-256 obtido:   ${ACTUAL_SHA256}" | tee -a inspection/integrity.txt
          test "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}"
          unzip -t inspection/reference.apk > inspection/zip-integrity.txt
          unzip -Z1 inspection/reference.apk > inspection/apk-file-list.txt
          mkdir -p inspection/extracted
          unzip -q inspection/reference.apk -d inspection/extracted
          {
            echo "## Estrutura interna"
            grep -E '^(AndroidManifest.xml|resources.arsc|classes([0-9]+)?\\.dex|lib/|res/)' inspection/apk-file-list.txt | head -n 250 || true
          } > inspection/apk-structure.md

      - name: Extrair metadados Android
        run: |
          set -euo pipefail
          {
            echo "# Metadados do APK"
            APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
            AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort | tail -n 1 || true)"
            if [ -n "${APKANALYZER}" ]; then
              echo "Ferramenta: apkanalyzer"
              for field in application-id version-name version-code min-sdk target-sdk; do
                printf '%s: ' "${field}"
                "${APKANALYZER}" manifest "${field}" inspection/reference.apk 2>&1 || true
              done
              echo
              echo "## Pacotes/classes DEX"
              "${APKANALYZER}" dex packages --defined-only inspection/reference.apk 2>&1 | head -n 300 || true
            elif [ -n "${AAPT}" ]; then
              echo "Ferramenta: aapt"
              "${AAPT}" dump badging inspection/reference.apk 2>&1 | head -n 100 || true
              "${AAPT}" dump permissions inspection/reference.apk 2>&1 | head -n 200 || true
            else
              echo "Android SDK analyzer não encontrado; estrutura e hashes foram coletados."
            fi
          } > inspection/android-metadata.md

      - name: Procurar indicadores de recursos no APK e no código
        env:
          APK_PATH: inspection/reference.apk
        run: |
          set -euo pipefail
          {
            echo "# Indicadores encontrados no APK (strings dos arquivos DEX)"
            find inspection/extracted -name '*.dex' -print0 | xargs -0 -r strings | grep -Ei 'firebaseauth|signInWithEmail|createUserWithEmail|firestore|nickname|displayName|playlist|multiplayer|room|multiplier|combo|audience|crowd|sustain|strum|acoustic|vocal|drum|bass|guitar' | sort -fu | head -n 500 || true
          } > inspection/apk-feature-strings.txt
          {
            echo "# Arquivos do código relacionados aos recursos solicitados"
            git grep -n -I -E 'FirebaseAuth|signInWithEmailAndPassword|createUserWithEmailAndPassword|Firestore|nickname|displayName|playlist|multiplayer|createRoom|multiplier|combo|audience|crowd|sustain|strum|acoustic|vocal|drum|bass|guitar' -- app ':!**/build/**' | head -n 700 || true
          } > inspection/source-feature-index.txt
          {
            echo "# Referências da análise"
            echo "Repositório: ${GITHUB_REPOSITORY}"
            echo "Commit analisado: ${GITHUB_SHA}"
            echo "Ref solicitada: ${{ inputs.source_ref }}"
            echo "Release ID: ${{ inputs.release_id }}"
            echo "Asset ID: ${{ inputs.asset_id }}"
            echo "APK: Guitar.Legends.apk"
            echo
            echo "Esta inspeção é estática. Presença de strings/classes não prova que uma função funciona em execução."
          } > inspection/README.md

      - name: Publicar relatório da inspeção
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relatorio-inspecao-apk-referencia
          path: inspection/
          if-no-files-found: error
          retention-days: 14
