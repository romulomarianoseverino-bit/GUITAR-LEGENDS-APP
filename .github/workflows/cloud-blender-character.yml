name: Auditoria do ambiente 3D na nuvem

on:
  push:
    branches:
      - feat/cloud-blender-character-pipeline
    paths:
      - ".github/workflows/cloud-blender-character.yml"
      - "tools/audit_mpfb_environment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils git libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libice6

      - name: Instalar Blender 4.2.5
        run: |
          curl -L --fail --retry 3 \
            https://mirror.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version

      - name: Instalar MPFB2 diretamente do repositório oficial
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          export BLENDER_USER_SCRIPTS="$RUNNER_TEMP/blender-user/scripts"
          mkdir -p "$BLENDER_USER_SCRIPTS/addons"
          cp -a "$RUNNER_TEMP/mpfb2/src/mpfb" "$BLENDER_USER_SCRIPTS/addons/mpfb"
          echo "BLENDER_USER_SCRIPTS=$BLENDER_USER_SCRIPTS" >> "$GITHUB_ENV"
          test -f "$BLENDER_USER_SCRIPTS/addons/mpfb/__init__.py"
          echo "MPFB2 copiado para o diretório de complementos do Blender."

      - name: Auditar Blender, MPFB2 e recursos disponíveis
        run: |
          "$RUNNER_TEMP/blender/blender" --background --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='mpfb'); bpy.ops.wm.save_userpref(); print('MPFB2_ADDON_ENABLED')" --python tools/audit_mpfb_environment.py

      - name: Guardar relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ambiente-3d
          path: |
            artifacts/mpfb-environment-report.json
            artifacts/mpfb-environment-report.txt
          if-no-files-found: warn
          retention-days: 14
