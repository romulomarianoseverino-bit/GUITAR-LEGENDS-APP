name: Gerar personagem humano 3D MPFB2

on:
  push:
    branches:
      - feat/cloud-blender-character-pipeline
      - feat/luan-inspired-stage-character
    paths:
      - ".github/workflows/cloud-blender-character.yml"
      - "tools/audit_mpfb_environment.py"
      - "tools/generate_mpfb_human_prototype.py"
      - ".github/workflows/generate-human-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 xz-utils git libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libice6

      - name: Instalar Blender 4.2.5
        run: |
          if ! aria2c --continue=true --allow-overwrite=true --auto-file-renaming=false \
            --file-allocation=none --max-connection-per-server=16 --split=16 --min-split-size=1M \
            --max-tries=8 --retry-wait=5 --connect-timeout=30 --timeout=600 \
            --dir=/tmp --out=blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz; then
            rm -f /tmp/blender.tar.xz
            aria2c --continue=true --allow-overwrite=true --auto-file-renaming=false \
              --file-allocation=none --max-connection-per-server=16 --split=16 --min-split-size=1M \
              --max-tries=8 --retry-wait=5 --connect-timeout=30 --timeout=600 \
              --dir=/tmp --out=blender.tar.xz \
              https://mirror.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz
          fi
          test -s /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version

      - name: Instalar MPFB2 diretamente do repositório oficial
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          BLENDER_USER_EXTENSIONS="$HOME/.config/blender/4.2/extensions"
          mkdir -p "$BLENDER_USER_EXTENSIONS/user_default"
          cp -a "$RUNNER_TEMP/mpfb2/src/mpfb" "$BLENDER_USER_EXTENSIONS/user_default/mpfb"
          test -f "$BLENDER_USER_EXTENSIONS/user_default/mpfb/blender_manifest.toml"
          test -f "$BLENDER_USER_EXTENSIONS/user_default/mpfb/__init__.py"
          echo "MPFB2 instalado como extensão Blender em user_default/mpfb."

      - name: Auditar Blender, MPFB2 e recursos disponíveis
        run: |
          "$RUNNER_TEMP/blender/blender" --background --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='bl_ext.user_default.mpfb'); print('MPFB2_EXTENSION_ENABLED')" --python tools/audit_mpfb_environment.py

      - name: Restaurar cache dos pacotes MPFB2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpfb-packs
          key: mpfb-assets-v2-${{ runner.os }}-${{ hashFiles('tools/generate_mpfb_human_prototype.py') }}

      - name: Baixar pacotes oficiais de recursos humanos em paralelo
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb-packs"
          cd "$RUNNER_TEMP/mpfb-packs"

          download_pack() {
            local file="$1"
            local primary="$2"
            local mirror="$3"
            if [ -s "$file" ] && unzip -t "$file" >/dev/null 2>&1; then
              echo "Pacote já disponível no cache: $file"
              return 0
            fi
            rm -f "$file"
            local partial="${file}.part"
            local url="$primary"
            if ! aria2c --continue=true --allow-overwrite=true --auto-file-renaming=false \
              --file-allocation=none --max-connection-per-server=8 --split=8 --min-split-size=1M \
              --max-tries=5 --retry-wait=5 --connect-timeout=30 --timeout=600 \
              --dir="$PWD" --out="$partial" "$url"; then
              rm -f "$partial"
              aria2c --continue=true --allow-overwrite=true --auto-file-renaming=false \
                --file-allocation=none --max-connection-per-server=8 --split=8 --min-split-size=1M \
                --max-tries=5 --retry-wait=5 --connect-timeout=30 --timeout=600 \
                --dir="$PWD" --out="$partial" "$mirror"
            fi
            unzip -t "$partial" >/dev/null
            mv "$partial" "$file"
            echo "DOWNLOAD_OK:$file"
          }

          download_pack system.zip \
            https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip &
          p1=$!
          download_pack shirts.zip \
            https://files2.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip &
          p2=$!
          download_pack pants.zip \
            https://files2.makehumancommunity.org/asset_packs/pants02/pants02_ccby.zip \
            https://files.makehumancommunity.org/asset_packs/pants02/pants02_ccby.zip &
          p3=$!
          download_pack shoes.zip \
            https://files2.makehumancommunity.org/asset_packs/shoes01/shoes01_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/shoes01/shoes01_cc0.zip &
          p4=$!

          status=0
          wait "$p1" || status=1
          wait "$p2" || status=1
          wait "$p3" || status=1
          wait "$p4" || status=1
          test "$status" -eq 0
          for file in system.zip shirts.zip pants.zip shoes.zip; do
            test -s "$file"
            unzip -t "$file" >/dev/null
            sha256sum "$file"
          done

      - name: Instalar recursos no diretório de dados MPFB2
        run: |
          USER_DATA="$HOME/.config/blender/4.2/extensions/user_default/mpfb/data"
          mkdir -p "$USER_DATA"
          python3 - "$RUNNER_TEMP/mpfb-packs" "$USER_DATA" <<'PY'
          import sys, zipfile, pathlib
          source, target = map(pathlib.Path, sys.argv[1:])
          for archive in source.glob("*.zip"):
              with zipfile.ZipFile(archive) as z:
                  z.extractall(target)
          packs = target / "packs"
          if not packs.exists() or not list(packs.glob("*.json")):
              raise SystemExit("Os pacotes não produziram metadados em packs/*.json")
          print("Pacotes instalados:", sorted(p.name for p in packs.glob("*.json")))
          PY

      - name: Gerar personagem humano vestido e exportar GLB
        run: |
          mkdir -p artifacts/character-prototype
          "$RUNNER_TEMP/blender/blender" --background \
            --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='bl_ext.user_default.mpfb')" \
            --python tools/generate_mpfb_human_prototype.py

      - name: Validar e registrar licenças dos recursos
        run: |
          test -s artifacts/character-prototype/guitar-legends-human-prototype.glb
          test -s artifacts/character-prototype/preview-front-3q.png
          test -s artifacts/character-prototype/prototype-report.json
          cat > artifacts/character-prototype/ASSET-LICENSES.txt <<'EOF'
          MakeHuman system assets: CC0 1.0, MakeHuman Community.
          Shirts01: CC0 1.0, MakeHuman Community / contributing authors.
          MakeHuman system assets: CC0 1.0, including the male casual suit and hair assets.
          Shirts01, Shoes01 and Pants02 packs may be downloaded by this workflow but are not used by this character revision.
          Catalog: https://download.makehumancommunity.org/assets/assetpacks/index.html
          Prototype only; not integrated into the Android production renderer.
          EOF
          ls -lh artifacts/character-prototype

      - name: Guardar relatório e personagem 3D gerado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototipo-personagem-3d-mpfb2
          path: |
            artifacts/mpfb-environment-report.json
            artifacts/mpfb-environment-report.txt
            artifacts/character-prototype/**
          if-no-files-found: warn
          retention-days: 14
