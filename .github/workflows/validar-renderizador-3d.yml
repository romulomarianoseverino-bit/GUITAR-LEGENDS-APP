name: Validar renderizador 3D real

on:
  push:
    branches:
      - feat/sceneview-3d-proof
  pull_request:
    branches:
      - main
      - feat/character-3d-mainline
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/example/guitarlegends/engine/Character3DSceneProof.kt'
      - 'app/src/debug/**'
      - '.github/workflows/validar-renderizador-3d.yml'

permissions:
  contents: read

jobs:
  compile-3d-proof:
    name: Gerar APK de depuração para teste 3D
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar SDK Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validar manifesto, compilar e gerar APK debug
        run: |
          gradle --no-daemon :app:processDebugManifest :app:compileDebugKotlin :app:assembleDebug

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: guitar-legends-sceneview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
