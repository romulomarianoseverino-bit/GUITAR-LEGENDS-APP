name: Validar renderizador 3D real

on:
  push:
    branches:
      - feat/sceneview-3d-proof
  pull_request:
    branches:
      - main
      - feat/character-3d-mainline
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/example/guitarlegends/engine/Character3DSceneProof.kt'
      - '.github/workflows/validar-renderizador-3d.yml'

permissions:
  contents: read

jobs:
  compile-3d-proof:
    name: Compilar prova do SceneView sem gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar SDK Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar fontes Kotlin do aplicativo
        run: gradle --no-daemon :app:compileDebugKotlin
