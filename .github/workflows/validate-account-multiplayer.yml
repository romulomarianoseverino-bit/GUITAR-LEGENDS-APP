name: Validar correções de conta e multiplayer

on:
  push:
    branches:
      - fix/nickname-not-found
      - fix/multiplayer-host-transfer
    paths:
      - "app/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/validate-account-multiplayer.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Compilar e executar testes focados com Auth e Firestore Emulator
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest --tests com.example.data.repository.AccountCloudRepositoryRuleTest --tests com.example.data.repository.MultiplayerCloudRepositoryRuleTest'
