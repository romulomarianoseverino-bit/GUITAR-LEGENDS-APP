name: Diagnostico minimo do GitHub Actions

on:
  push:
    branches:
      - repair/restore-current-working-gameplay
  workflow_dispatch:

jobs:
  actions-smoke-test:
    name: Teste minimo de inicializacao
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar inicializacao do runner
        run: |
          echo "GitHub Actions iniciou corretamente."
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
