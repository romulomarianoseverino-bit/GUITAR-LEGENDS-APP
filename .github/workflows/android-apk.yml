name: Validar APK da versão recuperada

on:
  push:
    branches:
      - repair/restore-current-working-gameplay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar, testar e publicar APK de validação
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compilar APK de depuração
        id: build
        run: gradle --no-daemon assembleDebug

      - name: Executar testes unitários
        id: tests
        if: always() && steps.build.outcome == "success"
        run: gradle --no-daemon testDebugUnitTest

      - name: Publicar APK de validação
        if: always() && steps.build.outcome == "success"
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-recuperacao
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
