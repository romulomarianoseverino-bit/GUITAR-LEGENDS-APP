name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar, testar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Firebase para o aplicativo Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 não foi configurado. O APK de depuração poderá ser compilado, mas o login Google/Firebase não estará configurado."
            exit 0
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = base64.b64decode(os.environ["GOOGLE_SERVICES_JSON_BASE64"], validate=True)
          config = json.loads(raw)
          expected_package = "com.aistudio.applet.kpfcic"
          clients = config.get("client", [])
          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          ]
          if expected_package not in packages:
              raise SystemExit(
                  f"google-services.json não contém o pacote Android esperado: {expected_package}"
              )
          Path("app/google-services.json").write_bytes(raw)
          print("Configuração Firebase validada para o pacote Android esperado.")
          PY

      - name: Criar chave de assinatura de depuração temporária
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        id: build
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK gerado
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Executar testes unitários
        id: tests
        if: always() && steps.build.outcome == 'success'
        run: gradle --no-daemon testDebugUnitTest
