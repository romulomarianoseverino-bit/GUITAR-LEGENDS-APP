name: Validar APK da versão recuperada
run-name: Validar APK recuperado — ${{ github.event_name }} — ${{ github.sha }}

on:
  push:
    branches:
      - repair/restore-current-working-gameplay
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guitar-legends-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Compilar, testar e publicar APK de validação
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Diagnosticar acionamento do fluxo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Início do fluxo de compilação do Guitar Legends"

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e ferramentas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list_installed

      - name: Configurar Gradle compatível com o projeto
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Verificar configuração Gradle
        run: gradle --no-daemon tasks --all

      - name: Compilar APK de depuração
        id: build
        run: gradle --no-daemon assembleDebug

      - name: Executar testes unitários
        id: tests
        if: success()
        run: gradle --no-daemon testDebugUnitTest

      - name: Publicar APK de validação
        if: steps.build.outcome == "success"
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-recuperacao
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
