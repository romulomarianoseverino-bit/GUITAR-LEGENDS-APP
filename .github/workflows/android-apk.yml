name: Validar APK da versão recuperada

on:
  push:
    branches:
      - repair/restore-current-working-gameplay
  workflow_dispatch:

jobs:
  build:
    name: Compilar e testar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK não encontrado em: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado dentro de $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d -print | head -80
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

      - name: Instalar ferramentas Android necessárias
        run: sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        id: build
        run: gradle --no-daemon assembleDebug

      - name: Executar testes unitários
        if: success()
        run: gradle --no-daemon testDebugUnitTest

      - name: Publicar APK de validação
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-recuperacao
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
