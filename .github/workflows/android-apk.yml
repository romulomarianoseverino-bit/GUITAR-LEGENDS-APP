name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar, testar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar chave de assinatura de depuração temporária
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Preparar chave privada de publicação
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::O segredo KEYSTORE_BASE64 está vazio."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::O segredo KEYSTORE_PASSWORD está vazio."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::O segredo KEY_PASSWORD está vazio."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-upload.jks"
          echo "Verificando a decodificação Base64..."
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::Não foi possível decodificar KEYSTORE_BASE64. Verifique se o segredo foi copiado por completo."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          echo "Arquivo decodificado. Tamanho: $(wc -c < "$KEYSTORE_PATH") bytes."
          echo "Verificando senha e alias da chave..."
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload >/dev/null; then
            echo "::error::O arquivo foi decodificado, mas a verificação da chave falhou. Confira a senha KEYSTORE_PASSWORD e o alias upload."
            exit 1
          fi
          echo "Chave de publicação validada com sucesso."
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        id: debug_build
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK de depuração
        if: always() && steps.debug_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compilar APK assinado de publicação
        id: release_build
        run: gradle --no-daemon assembleRelease

      - name: Publicar APK assinado
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Executar testes unitários
        id: tests
        if: always() && steps.debug_build.outcome == 'success'
        run: gradle --no-daemon testDebugUnitTest
