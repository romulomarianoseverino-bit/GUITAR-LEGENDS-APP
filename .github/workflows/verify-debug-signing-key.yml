name: Verificar chave de assinatura do APK de referência

on:
  push:
    branches:
      - fix/nickname-v1.2-isolated-2026-11-24
    paths:
      - ".github/workflows/verify-debug-signing-key.yml"

permissions:
  contents: read

jobs:
  verify-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar certificado, chave privada e senha sem revelar segredos
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::DEBUG_KEYSTORE_BASE64 não está disponível."; exit 1; }
          test -n "$DEBUG_KEYSTORE_PASSWORD" || { echo "::error::DEBUG_KEYSTORE_PASSWORD não está disponível."; exit 1; }
          test -n "$DEBUG_KEY_PASSWORD" || { echo "::error::DEBUG_KEY_PASSWORD não está disponível."; exit 1; }

          KEYSTORE="$RUNNER_TEMP/reference-signing.jks"
          INFO="$RUNNER_TEMP/key-info.txt"
          UNSIGNED_JAR="$RUNNER_TEMP/signing-probe.jar"
          SIGNED_JAR="$RUNNER_TEMP/signing-probe-signed.jar"
          PROBE_DIR="$RUNNER_TEMP/signing-probe"
          EXPECTED="3D:02:6D:2A:62:E1:B4:E8:DD:31:9B:05:6C:1C:03:CD:77:DC:D3:4F:E7:FC:1B:CF:2D:A6:9E:67:01:55:8F:E9"

          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          if ! keytool -list -v -keystore "$KEYSTORE" -storepass "$DEBUG_KEYSTORE_PASSWORD" > "$INFO" 2>/dev/null; then
            echo "::error::Não foi possível abrir o keystore. Nenhum valor secreto foi exibido."
            exit 1
          fi

          MATCHING_ALIAS="$(python3 - "$INFO" "$EXPECTED" <<'PY'
          import re
          import sys

          content = open(sys.argv[1], encoding="utf-8").read()
          expected = re.sub(r"[^0-9A-F]", "", sys.argv[2].upper())
          blocks = re.split(r"(?=^Alias name: )", content, flags=re.MULTILINE)
          matches = []
          for block in blocks:
              alias_match = re.search(r"^Alias name: (.+)$", block, re.MULTILINE)
              entry_match = re.search(r"^Entry type: (.+)$", block, re.MULTILINE)
              cert_match = re.search(r"^\s*SHA256: ([0-9A-F:]+)\s*$", block, re.MULTILINE | re.IGNORECASE)
              if not (alias_match and entry_match and cert_match):
                  continue
              fingerprint = re.sub(r"[^0-9A-F]", "", cert_match.group(1).upper())
              if fingerprint == expected and entry_match.group(1).strip() == "PrivateKeyEntry":
                  matches.append(alias_match.group(1).strip())
          if len(matches) != 1:
              sys.exit(2)
          print(matches[0])
          PY
          )" || {
            echo "::error::Não foi encontrada exatamente uma chave privada cujo certificado corresponda ao APK funcional."
            exit 1
          }

          echo "Certificado correspondente localizado em uma entrada de chave privada."
          mkdir -p "$PROBE_DIR"
          printf 'Guitar Legends signing verification\n' > "$PROBE_DIR/probe.txt"
          jar --create --file "$UNSIGNED_JAR" -C "$PROBE_DIR" .

          if ! jarsigner -keystore "$KEYSTORE" \
              -storepass "$DEBUG_KEYSTORE_PASSWORD" \
              -keypass "$DEBUG_KEY_PASSWORD" \
              -signedjar "$SIGNED_JAR" "$UNSIGNED_JAR" "$MATCHING_ALIAS" \
              > "$RUNNER_TEMP/jarsigner-sign.log" 2>&1; then
            echo "::error::A chave privada não pôde assinar o arquivo de teste. Verifique a senha da chave privada e o alias, sem compartilhar os valores."
            exit 1
          fi

          if ! jarsigner -verify "$SIGNED_JAR" > "$RUNNER_TEMP/jarsigner-verify.log" 2>&1; then
            echo "::error::A assinatura de teste foi criada, mas não passou na verificação criptográfica."
            exit 1
          fi

          echo "SUCESSO: certificado correto, entrada de chave privada encontrada e senha da chave privada validada por uma assinatura de teste."
          echo "Nenhum APK foi gerado; o arquivo de teste é temporário e será descartado com o runner."
