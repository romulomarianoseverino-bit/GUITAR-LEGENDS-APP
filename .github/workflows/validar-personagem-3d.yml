name: Validar personalização de personagens

on:
  push:
    branches:
      - feat/character-3d-mainline
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/guitarlegends/engine/Character3DRenderer.kt'
      - 'app/src/main/java/com/example/guitarlegends/model/ProgressionModels.kt'
      - 'app/src/main/java/com/example/guitarlegends/ui/screens/CustomizationStudioScreens.kt'
      - 'app/src/test/java/com/example/StudioAndHardwareTest.kt'
      - '.github/workflows/validar-personagem-3d.yml'

permissions:
  contents: read

jobs:
  test-customization:
    name: Compilar código e executar testes do estúdio
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Executar testes unitários sem gerar APK assinado
        run: gradle --no-daemon :app:testDebugUnitTest
