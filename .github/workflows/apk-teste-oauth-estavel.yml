name: APK de teste com assinatura OAuth compatível

on:
  push:
    branches:
      - fix/full-launch-scope-on-rewards-branch

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar APK com Firebase e assinatura estável
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar configuração Firebase e assinatura Android
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -s app/google-services.json || {
            echo "::error::app/google-services.json não encontrado."
            exit 1
          }
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure o segredo DEBUG_KEYSTORE_BASE64 com a chave debug.keystore estável usada no Firebase."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          ACTUAL_SHA1="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA1: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA1="$(python3 - <<'PY'
          import json
          data = json.load(open("app/google-services.json"))
          package = "com.aistudio.applet.kpfcic"
          for client in data.get("client", []):
              info = client.get("client_info", {})
              if info.get("android_client_info", {}).get("package_name") != package:
                  continue
              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 1 and oauth.get("android_info", {}).get("package_name") == package:
                      print(oauth.get("android_info", {}).get("certificate_hash", "").lower())
                      raise SystemExit(0)
          raise SystemExit("Cliente OAuth Android não encontrado para o pacote esperado.")
          PY
          )"
          if [ -z "$ACTUAL_SHA1" ] || [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::A assinatura do APK não corresponde ao SHA-1 OAuth do Firebase. Atualize o DEBUG_KEYSTORE_BASE64 com a chave cadastrada ou registre o SHA-1 dessa chave no Firebase e atualize google-services.json."
            exit 1
          fi
          echo "Firebase e SHA-1 da assinatura Android conferidos."

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-Teste-Firebase-OAuth
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
