name: Gerar APK de teste independente

on:
  push:
    branches:
      - fix/multiplayer-create-room-stage-diagnostics

permissions:
  contents: read

concurrency:
  group: guitar-legends-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compilar APK debug para instalação
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Gerar chave local de depuração
        run: |
          keytool -genkeypair -v -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Firebase CLI e dependências de teste
        run: |
          npm install --global firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase

      - name: Instalar dependências das Cloud Functions
        working-directory: functions
        run: npm ci

      - name: Executar testes e compilar com emuladores Firebase
        env:
          CI: true
        run: |
          firebase emulators:exec --project guitar-legends-d7708 --only auth,firestore,functions "node .github/scripts/wait-for-auth-emulator.cjs && npm test --prefix functions && gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug"

      - name: Publicar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-legends-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatórios dos testes Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-legends-android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
