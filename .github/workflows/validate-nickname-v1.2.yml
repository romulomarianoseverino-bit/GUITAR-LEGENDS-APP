name: Validar nickname isolado sobre a referência 1.2

on:
  push:
    branches:
      - fix/nickname-v1.2-isolated-2026-11-24
    paths:
      - "app/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/validate-nickname-v1.2.yml"

permissions:
  contents: read

jobs:
  nickname-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Java 21 (necessário para Robolectric com Android 16 / API 36)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Executar testes de conta com Auth e Firestore Emulator
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest --tests com.example.data.repository.AccountCloudRepositoryRuleTest'
