name: Testes das funções Firebase

on:
  push:
    branches:
      - fix/zero-start-rewards-security
  pull_request:
    branches:
      - main
      - fix/zero-start-rewards-security

jobs:
  reward-logic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Executar testes de recompensas
        run: npm test
