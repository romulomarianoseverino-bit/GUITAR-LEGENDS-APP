name: Validar preparação e gerar APK candidato

on:
  push:
    branches:
      - prep/next-apk-readiness-2026-11-24
      - feat/sustain-hold-scoring-fx
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "settings.gradle.kts"
      - ".github/workflows/validate-next-apk-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testar, compilar e publicar APK candidato
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - name: Executar testes unitários com Auth e Firestore Emulator
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest'

      - name: Compilar APK candidato (somente após todos os testes passarem)
        if: success()
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK candidato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-candidato
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatórios de testes (inclusive falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-preparacao
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
