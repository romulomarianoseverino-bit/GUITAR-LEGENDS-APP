name: Validar preparação da próxima versão (sem gerar APK)

on:
  push:
    branches:
      - prep/next-apk-readiness-2026-11-24
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "settings.gradle.kts"
      - ".github/workflows/validate-next-apk-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Compilar código e executar testes unitários (sem empacotar APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Executar testes unitários sem gerar APK
        run: gradle --no-daemon testDebugUnitTest
