name: Validar preparação e gerar APK candidato

on:
  push:
    branches:
      - prep/next-apk-readiness-2026-11-24
      - feat/sustain-hold-scoring-fx
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "settings.gradle.kts"
      - ".github/workflows/validate-next-apk-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testar, compilar e publicar APK candidato
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - name: Executar testes unitários com Auth e Firestore Emulator
        id: tests
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest'

      # Usa exclusivamente o keystore permanente do Guitar Legends, armazenado
      # nos segredos do GitHub. Se estiver ausente ou inválido, a compilação para.
      - name: Preparar chave permanente de assinatura
        id: prepare_signing
        if: always() && !cancelled()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::O segredo KEYSTORE_BASE64 está vazio."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::O segredo KEYSTORE_PASSWORD está vazio."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::O segredo KEY_PASSWORD está vazio."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-upload.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::Não foi possível decodificar a chave permanente."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          KEYTOOL_LOG="$RUNNER_TEMP/keytool-check.log"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload >"$KEYTOOL_LOG" 2>&1; then
            echo "::error::A chave permanente, a senha ou o alias upload não foram validados."
            exit 1
          fi
          echo "Keystore permanente e alias upload validados."
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # A compilação é independente do resultado dos testes automatizados.
      # Assim, uma falha isolada não impede a geração de um APK para validação humana.
      # O job continuará marcado como falho se os testes falharem; nenhum erro será ocultado.
      - name: Compilar APK candidato para teste humano
        id: build_apk
        if: always() && !cancelled()
        run: |
          gradle --no-daemon clean assembleRelease
          mkdir -p app/build/outputs/apk/release
          {
            echo "Tipo: APK candidato para teste humano (NAO VALIDADO PARA RELEASE)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Resultado dos testes automatizados: ${{ steps.tests.outcome }}"
          } > app/build/outputs/apk/release/BUILD-INFO.txt

      - name: Publicar APK candidato para teste humano
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-candidato-assinado-chave-permanente-nao-validado
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatórios de testes (inclusive falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-preparacao
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
