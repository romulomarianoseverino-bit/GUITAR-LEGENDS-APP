name: Diagnosticar login Google com assinatura estável

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-auth-debug-apk:
    name: Compilar APK de teste com chave estável
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Preparar chave de depuração estável
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.GOOGLE_DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.GOOGLE_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.GOOGLE_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::Configure o segredo GOOGLE_DEBUG_KEYSTORE_BASE64."; exit 1; }
          test -n "$DEBUG_KEYSTORE_PASSWORD" || { echo "::error::Configure o segredo GOOGLE_DEBUG_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$DEBUG_KEY_ALIAS" || { echo "::error::Configure o segredo GOOGLE_DEBUG_KEY_ALIAS."; exit 1; }
          test -n "$DEBUG_KEY_PASSWORD" || { echo "::error::Configure o segredo GOOGLE_DEBUG_KEY_PASSWORD."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$DEBUG_KEYSTORE_PASSWORD" -alias "$DEBUG_KEY_ALIAS" > "$RUNNER_TEMP/debug-key-info.txt"
          SHA1="$(grep -i 'SHA1:' "$RUNNER_TEMP/debug-key-info.txt" | head -n 1 | sed 's/^[[:space:]]*//')"
          test -n "$SHA1" || { echo "::error::Não foi possível ler a impressão digital SHA-1 da chave."; exit 1; }
          echo "DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "## Assinatura do APK de diagnóstico"
            echo
            echo "$SHA1"
            echo
            echo "Cadastre esta impressão SHA-1 no app Android do Firebase Authentication e baixe novamente o google-services.json se o Firebase solicitar."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-Google-Auth-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
